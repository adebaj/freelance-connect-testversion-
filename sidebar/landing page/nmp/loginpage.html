<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page</title>
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <div class="body">
      <!-- nav bar -->
      <div class="navbar">
        <a href="#">
          <span id="login">login</span>
        </a>
        <a href="#">
          <span id="register">register</span>
        </a>
      </div>
      <!-- email form -->
      <div class="emps">
        <h5 id="em">Email address</h5>
        <form action="">
          <input type="email" name="email" id="email" />
        </form>
        <!-- password form -->
        <h5 id="ps">password</h5>
        <form action="">
          <input type="password" name="login password" id="password" />
        </form>
      </div>
      <!-- remember me -->
      <div class="rembtn">
        <form action="">
          <input type="checkbox" name="remember me" id="two" />
          <p id="p">remember me</p>
        </form>
      </div>
      <!-- login btn -->
      <div class="logbtn">
        <form action="submit">
          <!-- <button type="button" id="bt" name="submit btn">login</button> -->
          <button id="bt">login</button>
        </form>
      </div>
      <a href="#">
        <p>forgot your passwword?</p>
      </a>
    </div>
  </body>
</html>
