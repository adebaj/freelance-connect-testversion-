    <div class="form-container">
      <h2>Post a Job</h2>
      <input type="text" id="title" placeholder="Job Title" />
      <textarea id="description" placeholder="Job Description"></textarea>
      <input type="number" id="budget" placeholder="Budget" />

      <label for="jobImage" class="image-label">Job Image (optional)</label>
      <input
        type="file"
        id="jobImage"
        accept="image/*"
        onchange="previewJobImage()"
      />
      <img id="imagePreview" class="image-preview" alt="Selected image preview" />

      <button class="btn submit-button" onclick="postJob()">Submit Job</button>
    </div>
